name: ai-service

on:
  push:
    paths: ["ai_service/**", ".github/workflows/ai-service.yml"]
  pull_request:
    paths: ["ai_service/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: antix
          POSTGRES_DB: antix_ai_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_TEST_DATABASE_URL: postgresql://postgres:antix@localhost:55432/antix_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai_service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check antix_ai tests migrations
      - run: pytest -q
      - name: build image
        run: docker build -t antix-ai:ci .
