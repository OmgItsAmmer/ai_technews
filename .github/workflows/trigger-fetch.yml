name: Trigger background fetch

on:
  schedule:
    # Every 45 minutes — wakes Fly.io machine and dispatches fetch pipeline
    - cron: "*/45 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST trigger-fetch endpoint
        run: |
          curl -sf -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ vars.FLY_APP_URL }}/internal/trigger-fetch/"
