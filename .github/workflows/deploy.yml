name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing the running one.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # "every" makes the ! exclusions apply: core = any changed file outside ai_service/ and docs/.
          predicate-quantifier: every
          filters: |
            core:
              - '**'
              - '!ai_service/**'
              - '!docs/**'
            ai:
              - 'ai_service/**'

  test-core:
    needs: changes
    if: needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m "not integration"
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: 'sqlite:///:memory:'
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: ci-test-openai-key
          CRON_SECRET: ci-test-cron-secret
          DJANGO_SETTINGS_MODULE: config.settings.test

  test-ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: antix
          POSTGRES_DB: antix_ai_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_TEST_DATABASE_URL: postgresql://postgres:antix@localhost:55432/antix_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai_service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The AI service deploys first so Django never points at an older API than it expects.
  deploy-ai:
    needs: [changes, test-ai]
    if: needs.changes.outputs.ai == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --no-public-ips
        working-directory: ai_service
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_AI }}

  deploy-core:
    needs: [changes, test-core, deploy-ai]
    # deploy-ai may be skipped (no AI changes); only a failure/cancel should block the core deploy.
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_CORE }}
