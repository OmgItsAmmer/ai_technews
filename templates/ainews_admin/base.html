{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Tech News - Admin{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'admin/css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <div class="logo">
                <a href="/admin/" class="logo-link"><span class="wordmark">ADD NEWS</span></a>
            </div>
            <nav class="user-nav">
                {% if request.user.is_authenticated %}
                    <span class="user-greeting">Welcome, <strong>{{ request.user.username }}</strong></span>
                    <a href="/admin/posts/post/" class="nav-link">All Posts</a>
                    <a href="/admin/logout/" class="logout-btn">Log out</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
