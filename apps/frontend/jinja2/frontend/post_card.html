<div class="card"
     data-id="{{ post.id }}"
     data-tags="{{ post.tags | join_tags }}"
     data-date="{{ post.published_at.strftime('%Y-%m-%d') }}">
  <div class="card-top">
    <h3 class="card-title">{{ post.title }}</h3>
    <button class="save-btn" 
            data-id="{{ post.id }}"
            onclick="toggleSave(this, '{{ post.id }}')"
            aria-label="Save article">
      <i class="ti ti-bookmark" aria-hidden="true"></i>
    </button>
  </div>
  <div class="card-summary-wrap">
    <p class="card-summary">{{ post.summary }}</p>
    <button class="read-more-btn" onclick="openModal(this)">Read more...</button>
  </div>
  <div class="card-tags">
    {% for tag in post.tags %}
    <span class="card-tag">{{ tag }}</span>
    {% endfor %}
  </div>
  <div class="card-footer">
    <div class="card-meta">
      <span class="card-author">{{ post.author_name }}</span>
      <span class="card-source">{{ post.source_name }}</span>
    </div>
    <div class="card-right">
      <span>{{ post.published_at.strftime('%b %d, %Y') }}</span>
      <a href="{{ post.original_url }}" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="read-link">Read →</a>
    </div>
  </div>
</div>
