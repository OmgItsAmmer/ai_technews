<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Tech News - Admin{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ static('css/style.css') }}">
    <script src="{{ static('js/theme.js') }}"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Hidden SVGs for theme toggling icons -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
      <symbol viewBox="0 0 24 24" width="1.5rem" height="1.5rem" id="icon-auto"><path d="M0 0h24v24H0z" fill="currentColor"/><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm0-2V4a8 8 0 1 0 0 16z"/></symbol>
      <symbol viewBox="0 0 24 24" width="1.5rem" height="1.5rem" id="icon-moon"><path d="M0 0h24v24H0z" fill="currentColor"/><path d="M10 7a7 7 0 0 0 12 4.9v.1c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2h.1A6.979 6.979 0 0 0 10 7zm-6 5a8 8 0 0 0 15.062 3.762A9 9 0 0 1 8.238 4.938 7.999 7.999 0 0 0 4 12z"/></symbol>
      <symbol viewBox="0 0 24 24" width="1.5rem" height="1.5rem" id="icon-sun"><path d="M0 0h24v24H0z" fill="currentColor"/><path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.515 4.929l1.414-1.414L7.05 5.636 5.636 7.05 3.515 4.93zM16.95 18.364l1.414-1.414 2.121 2.121-1.414 1.414-2.121-2.121zm2.121-14.85l1.414 1.415-2.121 2.121-1.414-1.414 2.121-2.121zM5.636 16.95l1.414 1.414-2.121 2.121-1.414-1.414 2.121-2.121zM23 11v2h-3v-2h3zM4 11v2H1v-2h3z"/></symbol>
    </svg>
    <header class="app-header">
        <div class="header-container">
            <div class="logo">
                <a href="/admin/" class="logo-link"><span class="wordmark">ADD NEWS</span></a>
            </div>
            <nav class="user-nav">
                {% if request.user.is_authenticated %}
                    <span class="user-greeting">Welcome, <strong>{{ request.user.username }}</strong></span>
                    <a href="/admin/posts/post/" class="nav-link">Debug List</a>
                    <form id="logout-form" method="post" action="/admin/logout/" style="display: inline;">
                        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                        <button type="submit" class="logout-btn" style="background: none; border: 1px solid var(--border); padding: var(--space-8) var(--space-12); border-radius: 4px; color: var(--text); font-family: inherit; font-size: inherit; cursor: pointer; margin-right: 8px;">Log out</button>
                    </form>
                    <button class="theme-toggle" style="background: none; border: none; cursor: pointer; color: var(--text); padding: 4px; display: inline-flex; align-items: center;" title="Toggle theme">
                        <svg class="theme-icon-when-auto" style="display: none; width: 18px; height: 18px; fill: currentColor;"><use xlink:href="#icon-auto"></use></svg>
                        <svg class="theme-icon-when-dark" style="display: none; width: 18px; height: 18px; fill: currentColor;"><use xlink:href="#icon-moon"></use></svg>
                        <svg class="theme-icon-when-light" style="display: none; width: 18px; height: 18px; fill: currentColor;"><use xlink:href="#icon-sun"></use></svg>
                    </button>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
