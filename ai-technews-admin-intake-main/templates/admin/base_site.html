{% extends "admin/base.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
  /* Root element theme color overrides to force styling tokens onto default admin variables */
  :root, html[data-theme="dark"], html[data-theme="auto"] {
    --primary: var(--surface2) !important;
    --secondary: var(--surface) !important;
    --breadcrumbs-bg: var(--surface2) !important;
    --breadcrumbs-fg: var(--text-muted) !important;
    --breadcrumbs-link-fg: var(--text-muted) !important;
    --body-bg: var(--bg) !important;
    --body-fg: var(--text) !important;
    --body-quiet-color: var(--text-dim) !important;
    --body-medium-color: var(--text-muted) !important;
    --body-loud-color: var(--text) !important;
    --border-color: var(--border) !important;
    --hairline-color: var(--border) !important;
    --link-fg: var(--red) !important;
    --link-hover-color: var(--text) !important;
    --selected-row: rgba(229, 9, 20, 0.08) !important;
    --selected-bg: rgba(229, 9, 20, 0.12) !important;
    --button-bg: var(--surface2) !important;
    --button-hover-bg: var(--border) !important;
    --default-button-bg: var(--red) !important;
    --default-button-hover-bg: var(--red) !important;
  }

  html[data-theme="light"] {
    --primary: #e9ecef !important;
    --secondary: #f8f9fa !important;
    --breadcrumbs-bg: #e9ecef !important;
    --breadcrumbs-fg: #495057 !important;
    --breadcrumbs-link-fg: #495057 !important;
    --body-bg: #f8f9fa !important;
    --body-fg: #212529 !important;
    --body-quiet-color: #868e96 !important;
    --body-medium-color: #495057 !important;
    --body-loud-color: #212529 !important;
    --border-color: rgba(0, 0, 0, 0.08) !important;
    --hairline-color: rgba(0, 0, 0, 0.08) !important;
    --link-fg: var(--red) !important;
    --link-hover-color: #212529 !important;
    --selected-row: rgba(229, 9, 20, 0.05) !important;
    --selected-bg: rgba(229, 9, 20, 0.08) !important;
    --button-bg: #e9ecef !important;
    --button-hover-bg: rgba(0, 0, 0, 0.08) !important;
    --default-button-bg: var(--red) !important;
    --default-button-hover-bg: var(--red) !important;
  }

  body {
    background-color: var(--bg) !important;
    color: var(--text) !important;
    font-family: var(--font-body) !important;
  }
  
  #header {
    background: var(--surface) !important;
    border-bottom: 1px solid var(--border) !important;
    padding: var(--space-16) var(--space-24) !important;
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    color: var(--text) !important;
  }
  
  #branding h1 {
    font-family: var(--font-display) !important;
    color: var(--red) !important;
    font-size: 2.2rem !important;
    letter-spacing: 2px !important;
    margin: 0 !important;
  }
  
  #branding h1 a {
    color: var(--red) !important;
    text-decoration: none !important;
  }
  
  #user-tools {
    font-family: var(--font-body) !important;
    color: var(--text-muted) !important;
    display: flex !important;
    align-items: center !important;
    gap: var(--space-12) !important;
  }
  
  #user-tools a {
    color: var(--text-muted) !important;
    text-decoration: none !important;
  }
  
  #user-tools a:hover {
    color: var(--text) !important;
  }
  
  #logout-form button {
    font-family: var(--font-body) !important;
    font-size: 0.85rem !important;
    color: var(--text) !important;
    background-color: transparent !important;
    border: 1px solid var(--border) !important;
    padding: var(--space-8) var(--space-12) !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    transition: border-color 0.15s ease !important;
  }
  
  #logout-form button:hover {
    border-color: var(--text-muted) !important;
  }

  /* Standard Theme Toggle button visibility in overridden base template */
  #user-tools .theme-toggle {
    background: none !important;
    border: none !important;
    cursor: pointer !important;
    color: var(--text) !important;
    padding: 4px !important;
    display: inline-flex !important;
    align-items: center !important;
  }

  html[data-theme="auto"] #user-tools .theme-toggle svg.theme-icon-when-auto { display: block !important; }
  html[data-theme="dark"] #user-tools .theme-toggle svg.theme-icon-when-dark { display: block !important; }
  html[data-theme="light"] #user-tools .theme-toggle svg.theme-icon-when-light { display: block !important; }

  #user-tools .theme-toggle svg {
    width: 18px !important;
    height: 18px !important;
    fill: currentColor !important;
    display: none;
  }

  .breadcrumbs {
    background: var(--surface2) !important;
    border-bottom: 1px solid var(--border) !important;
    color: var(--text-muted) !important;
    font-family: var(--font-body) !important;
  }

  .breadcrumbs a {
    color: var(--text-muted) !important;
  }

  .breadcrumbs a:hover {
    color: var(--text) !important;
  }

  div.breadcrumbs {
    padding: 10px 40px !important;
  }

  /* Main content area styling */
  #content {
    background-color: var(--bg) !important;
    color: var(--text) !important;
    padding: 40px !important;
  }

  h1, h2, h3, h4 {
    font-family: var(--font-body) !important;
    color: var(--text) !important;
  }

  #content h1 {
    font-family: var(--font-display) !important;
    font-size: 2.5rem !important;
    letter-spacing: 1px !important;
    border-bottom: 2px solid var(--border) !important;
    padding-bottom: var(--space-8) !important;
    margin-bottom: var(--space-20) !important;
  }

  /* Table styles on change list pages */
  #changelist {
    background-color: var(--surface) !important;
    border: 1px solid var(--border) !important;
    border-radius: 8px !important;
    padding: 20px !important;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5) !important;
    color: var(--text) !important;
  }

  #changelist-filter {
    background-color: var(--surface2) !important;
    border-left: 1px solid var(--border) !important;
  }

  #changelist-filter h2 {
    background-color: var(--surface) !important;
    color: var(--text) !important;
    border-bottom: 1px solid var(--border) !important;
  }

  #changelist-filter a {
    color: var(--text-muted) !important;
  }

  #changelist-filter a:hover, #changelist-filter li.selected a {
    color: var(--red) !important;
  }

  .results {
    border-radius: 4px !important;
    overflow: hidden !important;
    border: 1px solid var(--border) !important;
  }

  table {
    background-color: var(--surface) !important;
    width: 100% !important;
  }

  thead th {
    background-color: var(--surface2) !important;
    border-bottom: 1px solid var(--border) !important;
    color: var(--text-muted) !important;
    font-weight: bold !important;
  }

  thead th a {
    color: var(--text-muted) !important;
  }

  tbody tr {
    border-bottom: 1px solid var(--border) !important;
  }

  tbody tr:nth-child(even) {
    background-color: rgba(255, 255, 255, 0.02) !important;
  }

  tbody tr:hover {
    background-color: rgba(255, 255, 255, 0.05) !important;
  }

  tbody td, tbody th {
    border-bottom: 1px solid var(--border) !important;
    color: var(--text) !important;
  }

  tbody th a {
    color: var(--text) !important;
  }

  tbody th a:hover {
    color: var(--red) !important;
  }

  /* Forms on Edit / Add pages */
  .module {
    background-color: var(--surface) !important;
    border: 1px solid var(--border) !important;
    border-radius: 8px !important;
  }

  .module h2 {
    background-color: var(--surface2) !important;
    color: var(--text) !important;
    border-bottom: 1px solid var(--border) !important;
  }

  .form-row {
    border-bottom: 1px solid var(--border) !important;
  }

  /* Navigation Sidebar */
  #js-nav-sidebar {
    background-color: var(--surface) !important;
    border-right: 1px solid var(--border) !important;
  }

  .nav-sidebar {
    background-color: var(--surface) !important;
  }

  .nav-sidebar th, .nav-sidebar td {
    color: var(--text) !important;
  }

  .nav-sidebar a {
    color: var(--text-muted) !important;
  }

  .nav-sidebar a:hover {
    color: var(--text) !important;
  }

  .nav-sidebar tr.selected {
    background-color: var(--surface2) !important;
  }

  /* Django buttons & actions */
  .submit-row {
    background-color: var(--surface2) !important;
    border: 1px solid var(--border) !important;
    border-radius: 6px !important;
  }

  .button, input[type=submit], input[type=button], .submit-row a.deletelink {
    background-color: var(--surface2) !important;
    border: 1px solid var(--border) !important;
    color: var(--text) !important;
    padding: var(--space-8) var(--space-16) !important;
    border-radius: 4px !important;
    font-weight: 500 !important;
    transition: border-color 0.15s ease, background-color 0.15s ease !important;
  }

  .button:hover, input[type=submit]:hover, input[type=button]:hover {
    border-color: var(--text-muted) !important;
  }

  .button.default, input[type=submit].default {
    background-color: var(--red) !important;
    border: none !important;
    color: #ffffff !important;
  }

  .button.default:hover, input[type=submit].default:hover {
    filter: brightness(1.1) !important;
  }

  /* Text inputs, selects, textareas inside standard admin forms */
  input[type=text], input[type=password], input[type=email], input[type=url], input[type=number], input[type=tel],
  select, textarea, .vTextField, .vURLField, .vLargeTextField {
    background-color: var(--surface2) !important;
    border: 1px solid var(--border) !important;
    color: var(--text) !important;
    border-radius: 4px !important;
    padding: 6px 10px !important;
  }

  input[type=text]:focus, input[type=password]:focus, select:focus, textarea:focus {
    border-color: var(--text-muted) !important;
    outline: none !important;
  }

  /* Fix for label color in forms */
  .form-row label {
    color: var(--text-muted) !important;
  }

  /* Help texts */
  .help, .help-tooltip {
    color: var(--text-dim) !important;
  }

  /* Search bar on change lists */
  #searchbar {
    background-color: var(--surface2) !important;
    border: 1px solid var(--border) !important;
    color: var(--text) !important;
    border-radius: 4px !important;
    padding: 6px 12px !important;
  }

  #toolbar {
    background-color: var(--surface) !important;
    border: 1px solid var(--border) !important;
    border-radius: 6px !important;
    margin-bottom: 15px !important;
  }

  /* Pagination styles */
  .paginator {
    background-color: var(--surface) !important;
    border-top: 1px solid var(--border) !important;
    color: var(--text-muted) !important;
    font-family: var(--font-body) !important;
  }

  .paginator a {
    color: var(--text-muted) !important;
  }

  .paginator a:hover {
    color: var(--text) !important;
  }

  .paginator .this-page {
    color: var(--text) !important;
    font-weight: bold !important;
  }

  /* Error note styles */
  .errornote {
    background-color: var(--surface2) !important;
    border-left: 4px solid var(--red) !important;
    color: var(--text) !important;
  }

  /* Fix admin container spacing */
  #container {
    background-color: var(--bg) !important;
  }
</style>
{% endblock %}
