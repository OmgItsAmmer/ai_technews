# Antix AI service on Fly.io. Deploy from this directory:  fly deploy --no-public-ips
# Private app: no public IPs. Django reaches it over Flycast at http://ainews-ai.flycast
# (allocate once with:  fly ips allocate-v6 --private -a ainews-ai).
# Going through Fly's proxy lets the machine sleep when idle and wake on the next request.
# Validate before the first deploy with:  fly config validate
app = "ainews-ai"
primary_region = "iad"

[build]

[deploy]
  release_command = "antix-ai migrate"

[env]
  AI_ENV = "prod"
  AI_LOG_JSON = "true"

[processes]
  # API + arq worker + local Redis share one machine so the whole service can sleep when idle.
  # "::" so the API listens on IPv6, which Flycast/6PN traffic uses.
  app = "sh -c 'redis-server --daemonize yes && antix-ai worker & exec antix-ai serve --host :: --port 8100'"

[http_service]
  internal_port = 8100
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/ready"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  processes = ["app"]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
