# Antix AI service on Fly.io. Deploy from this directory:  fly launch --no-deploy --copy-config ; fly deploy
# Private app: no public HTTP service. Django reaches it at http://ainews-ai.internal:8100 over Fly's 6PN network.
# NOTE: not deployed or validated from here -- check with `fly config validate` before the first deploy.
app = "ainews-ai"
primary_region = "iad"

[build]

[deploy]
  release_command = "antix-ai migrate"

[processes]
  # "::" so the process listens on IPv6, which .internal DNS resolves to
  api = "antix-ai serve --host :: --port 8100"
  worker = "antix-ai worker"

[env]
  AI_ENV = "prod"
  AI_LOG_JSON = "true"

[checks.ready]
  type = "http"
  port = 8100
  path = "/ready"
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  processes = ["api"]

[[vm]]
  processes = ["api"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  processes = ["worker"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
