app = "ainews"
primary_region = "iad"

[build]

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  REDIS_URL = "redis://127.0.0.1:6379/0"
  # Ask AI is served by the Antix AI service (separate Fly app "ainews-ai", see ai_service/fly.toml)
  AI_BACKEND = "antix"
  AI_SERVICE_URL = "http://ainews-ai.internal:8100"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  web = "supervisord -c /etc/supervisor/conf.d/supervisord.conf"
